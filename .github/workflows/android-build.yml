name: Compilar APK de WoWee (Android Solo)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK para Celular
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código fuente
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Variables del SDK de Android
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV

    - name: Aceptar Licencias de Android
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Instalar versión exacta NDK y CMake
      run: |
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

    - name: Descomprimir Librerías (GLM y SDL3)
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        
        # 1. Descomprimir GLM en la carpeta include/
        rm -rf include/glm
        unzip -q extern/glm.zip -d include/
        
        # 2. Preparar carpetas limpias para SDL3
        rm -rf include/SDL3
        rm -rf android/sdl3
        mkdir -p include
        mkdir -p android/sdl3/arm64-v8a
        
        # 3. DESCOMPRIMIR TU ARCHIVO SDL3.ZIP
        unzip -q extern/SDL3.zip -d android/sdl3_temp/
        
        # 4. Mover cada elemento a su ubicación exacta para el compilador
        mv android/sdl3_temp/SDL3 include/
        mv android/sdl3_temp/libSDL3.so android/sdl3/arm64-v8a/
        
        # Limpiar carpeta temporal
        rm -rf android/sdl3_temp/

        # RETROCOMPATIBILIDAD DE ENLAZADO LOCAL:
        if [ -f "android/openssl/include/openssl/configuration.h" ]; then
          cp android/openssl/include/openssl/configuration.h android/openssl/include/openssl/opensslconf.h
          echo "¡opensslconf.h enlazado correctamente de forma local!"
        fi

    # 🔥 PARCHE AUTOMÁTICO DE COMPATIBILIDAD VULKAN CORREGIDO:
    - name: Parche Automático de Compatibilidad Vulkan
      run: |
        echo "Aplicando parches de compatibilidad inline explícitos en... VkBootstrap.h"
        
        # Eliminamos la última línea de cierre provisionalmente para meter el puente
        sed -i '$d' extern/vk-bootstrap/src/VkBootstrap.h
        
        # Inyectamos las funciones usando el tipado explícito vkb:: para evitar ambigüedades
        cat << 'EOF' >> extern/vk-bootstrap/src/VkBootstrap.h
        
        // Extensiones agregadas por el script de compilación para soporte móvil Vulkan 1.1
        inline void enable_features_if_present(const vkb::PhysicalDevice&, const void*) {}
        inline void enable_extension_if_present(const vkb::PhysicalDevice&, const char*) {}
        inline bool is_extension_present(const vkb::PhysicalDevice&, const char*) { return false; }

        struct CustomQueueDescription {
            uint32_t index = 0;
            std::vector<float> priorities;
            CustomQueueDescription() = default;
            CustomQueueDescription(uint32_t i, std::vector<float> p) : index(i), priorities(p) {}
        };

        } // namespace vkb
        EOF
        echo "¡Archivo VkBootstrap.h parchado con tipos explícitos con éxito!"

    - name: Forzar Permisos Totales en Linux
      run: |
        find . -type f -name "*.sh" -exec chmod +x {} + || true
        chmod -R +x tools/ || true
        chmod -R +x android/ || true

    - name: Compilar APK con Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        # Protección de RAM para el runner de GitHub
        GRADLE_OPTS: "-Xmx1548m -Dorg.gradle.workers.max=1"
        # Compilación nativa en un solo hilo para evitar cuelgues del servidor
        CMAKE_BUILD_PARALLEL_LEVEL: "1"
      run: |
        cd android
        rm -rf app/.cxx/
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon \
          "-Pandroid.overridePathCheck=true" \
          "-Pandroid.injected.build.model.only=false"

    - name: Guardar y Descargar APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: wowee-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
