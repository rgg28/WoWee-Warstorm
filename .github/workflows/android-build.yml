name: Compilar APK de WoWee (Android Solo)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK para Celular
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código fuente
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Variables del SDK de Android
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV

    - name: Aceptar Licencias de Android
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Instalar versión exacta NDK y CMake
      run: |
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

    - name: Descomprimir y Corregir Ruta de GLM (Solución Definitiva)
      run: |
        # Aseguramos la instalación de unzip en el servidor Linux
        sudo apt-get update && sudo apt-get install -y unzip
        
        # 1. Descomprimimos el archivo glm.zip completo en una carpeta temporal limpia
        mkdir -p temporal_glm
        unzip -q extern/glm.zip -d temporal_glm
        
        # 2. Creamos la carpeta destino exacta que el motor del juego busca
        mkdir -p extern/glm
        
        # 3. Buscamos de forma automatica la posicion de la carpeta hpp interna y movemos sus archivos a la ruta final
        # Esto soluciona de raiz el problema de si la carpeta se llama glm-master o similar
        CP_DIR=$(find temporal_glm -type d -name "glm" | head -n 1)
        cp -r ${CP_DIR}/* extern/glm/ || true

    - name: Forzar Permisos Totales en Linux
      run: |
        find . -type f -name "*.sh" -exec chmod +x {} + || true
        chmod -R +x tools/ || true
        chmod -R +x android/ || true

    - name: Compilar APK con Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      run: |
        cd android
        # Borramos la cache nativa para limpiar los rastros del intento fallido anterior
        rm -rf app/.cxx/
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon \
          "-Pandroid.overridePathCheck=true" \
          "-Pandroid.injected.build.model.only=false"

    - name: Guardar y Descargar APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: wowee-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
