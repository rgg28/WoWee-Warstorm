name: Compilar APK de WoWee (Android Solo)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK para Celular
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código fuente
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Variables del SDK de Android
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV

    - name: Aceptar Licencias de Android
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Instalar versión exacta NDK y CMake
      run: |
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

    - name: Construir Ruta de Emergencia para Ninja (Solución Definitiva)
      run: |
        # Generamos la carpeta espejo exacta en la raiz que calza con el retroceso de Ninja
        mkdir -p openssl/arm64-v8a
        
        # Copiamos tus librerías fisicas a esa posicion relativa externa para que Ninja las encuentre sí o sí
        cp -r android/openssl/include openssl/ || true
        cp android/openssl/arm64-v8a/*.a openssl/arm64-v8a/ || true
        cp android/openssl/arm64-v8a/*.so openssl/arm64-v8a/ || true

    - name: Forzar Permisos Totales en Linux
      run: |
        find . -type f -name "*.sh" -exec chmod +x {} + || true
        chmod -R +x tools/ || true
        chmod -R +x android/ || true

    - name: Compilar APK con Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      run: |
        cd android
        # Destruimos los archivos temporales viejos para obligar a recalcular todo
        rm -rf app/.cxx/
        ./gradlew clean
        
        # Corremos la compilacion inyectando la variable opensslRoot fija
        ./gradlew assembleDebug --no-daemon \
          "-PopensslRoot=openssl" \
          "-Pandroid.overridePathCheck=true" \
          "-Pandroid.injected.build.model.only=false"

    - name: Guardar y Descargar APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: wowee-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
