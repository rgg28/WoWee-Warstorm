name: Compilar APK de WoWee

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código fuente
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Variables del SDK de Android
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV

    - name: Aceptar Licencias de Android
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Instalar versión exacta de NDK y CMake
      run: |
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

    - name: Parchear CMakeLists.txt para OpenSSL de Android
      run: |
        # Definimos la ruta absoluta total para que Ninja no use ../../../
        OPENSSL_DIR="/home/runner/work/WoWee-Warstorm/WoWee-Warstorm/android/openssl"
        
        PARCHE_ALIAS="set(OPENSSL_INCLUDE_DIR \"${OPENSSL_DIR}/include\")\n\
        set(OPENSSL_CRYPTO_LIBRARY \"${OPENSSL_DIR}/arm64-v8a/libcrypto.a\")\n\
        set(OPENSSL_SSL_LIBRARY \"${OPENSSL_DIR}/arm64-v8a/libssl.a\")\n\
        set(OPENSSL_LIBRARIES \${OPENSSL_CRYPTO_LIBRARY} \${OPENSSL_SSL_LIBRARY})\n\
        set(OpenSSL_FOUND TRUE)\n\
        if(NOT TARGET OpenSSL::Crypto)\n\
          add_library(OpenSSL::Crypto UNKNOWN IMPORTED)\n\
          set_target_properties(OpenSSL::Crypto PROPERTIES IMPORTED_LOCATION \"\${OPENSSL_CRYPTO_LIBRARY}\" INTERFACE_INCLUDE_DIRECTORIES \"\${OPENSSL_INCLUDE_DIR}\")\n\
        endif()\n\
        if(NOT TARGET OpenSSL::SSL)\n\
          add_library(OpenSSL::SSL UNKNOWN IMPORTED)\n\
          set_target_properties(OpenSSL::SSL PROPERTIES IMPORTED_LOCATION \"\${OPENSSL_SSL_LIBRARY}\" INTERFACE_LINK_LIBRARIES OpenSSL::Crypto)\n\
        endif()"
        
        sed -i "s|find_package(OpenSSL REQUIRED)|${PARCHE_ALIAS}|g" CMakeLists.txt

    - name: Forzar Permisos Totales en Linux
      run: |
        find . -type f -name "*.sh" -exec chmod +x {} + || true
        chmod -R +x tools/ || true
        chmod -R +x android/ || true

    - name: Compilar APK de Depuración (Debug)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      run: |
        cd android
        # Forzamos una limpieza total de las carpetas de caché .cxx de CMake antes de compilar
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon

    - name: Subir la APK resultante a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: wowee-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
