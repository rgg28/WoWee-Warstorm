    - name: Configurar Entorno de Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV

    - name: Aceptar Licencias del SDK de Android
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Instalar Dependencias NDK y CMake
      run: |
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

    - name: Preparar Librerías Externas (GLM y SDL3)
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        
        # 1. Descomprimir GLM
        rm -rf include/glm
        unzip -q extern/glm.zip -d include/
        
        # 2. Preparar carpetas limpias para SDL3
        rm -rf include/SDL3
        rm -rf android/sdl3
        mkdir -p include
        mkdir -p android/sdl3/arm64-v8a
        
        # 3. Descomprimir SDL3
        unzip -q extern/SDL3.zip -d android/sdl3_temp/
        
        # 4. Organizar elementos para el compilador
        mv android/sdl3_temp/SDL3 include/
        mv android/sdl3_temp/libSDL3.so android/sdl3/arm64-v8a/
        rm -rf android/sdl3_temp/
        
        # 5. Enlace local de OpenSSL
        if [ -f "android/openssl/include/openssl/configuration.h" ]; then
          cp android/openssl/include/openssl/configuration.h android/openssl/include/openssl/opensslconf.h
          echo "¡opensslconf.h enlazado correctamente de forma local!"
        fi

    - name: Generar Keystore Digital en Tiempo de Ejecución
      env:
        STORE_PASS: ${{ secrets.STORE_PASS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
      run: |
        if [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
          echo "Error crítico: Los secretos de contraseñas de firma están vacíos en GitHub."
          exit 1
        fi
        echo "Generando wowee-release.jks..."
        keytool -genkey -v \
          -keystore android/app/wowee-release.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias wowee-alias \
          -storepass "$STORE_PASS" \
          -keypass "$KEY_PASS" \
          -dname "CN=Wowee, OU=Warstorm, O=WoWee-Warstorm, L=Mobiles, S=Graphics, C=US"
        echo "¡Llave keystore generada con éxito!"

    - name: Asignar Permisos de Ejecución
      run: |
        find . -type f -name "*.sh" -exec chmod +x {} + || true
        chmod -R +x tools/ || true
        chmod -R +x android/ || true

    - name: Compilar y Firmar APK (Gradle)
      env:
        WOWEE_RELEASE_STORE_FILE: "wowee-release.jks"
        WOWEE_RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASS }}
        WOWEE_RELEASE_KEY_ALIAS: "wowee-alias"
        WOWEE_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASS }}
        GRADLE_OPTS: "-Xmx1548m -Dorg.gradle.workers.max=1"
        CMAKE_BUILD_PARALLEL_LEVEL: 1
      run: |
        cd android
        rm -rf app/.cxx/
        ./gradlew clean
        ./gradlew assembleRelease --no-daemon \
          "-Pandroid.overridePathCheck=true" \
          "-Pandroid.injected.build.model.only=false" \
          "-PRELEASE_STORE_FILE=$WOWEE_RELEASE_STORE_FILE" \
          "-PRELEASE_STORE_PASSWORD=$WOWEE_RELEASE_STORE_PASSWORD" \
          "-PRELEASE_KEY_ALIAS=$WOWEE_RELEASE_KEY_ALIAS" \
          "-PRELEASE_KEY_PASSWORD=$WOWEE_RELEASE_KEY_PASSWORD"
