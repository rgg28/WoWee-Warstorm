name: Compilar APK de WoWee

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código fuente
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Variables del SDK de Android
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV

    - name: Aceptar Licencias de Android
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Instalar versión exacta de NDK y CMake
      run: |
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

    - name: Engañar la Ruta Nativa de OpenSSL (Solución de Ruta Dinámica)
      run: |
        # Creamos la carpeta exacta usando la variable de espacio de trabajo para evitar fallos de mayúsculas
        mkdir -p ${{ github.workspace }}/build-android-deps/arm64-v8a
        
        # Copiamos tus archivos fisicos de OpenSSL con sus cabeceras a la ruta esperada
        cp -r ${{ github.workspace }}/android/openssl/include ${{ github.workspace }}/build-android-deps/arm64-v8a/
        cp ${{ github.workspace }}/android/openssl/arm64-v8a/*.a ${{ github.workspace }}/build-android-deps/arm64-v8a/ || true
        cp ${{ github.workspace }}/android/openssl/arm64-v8a/*.so ${{ github.workspace }}/build-android-deps/arm64-v8a/ || true

    - name: Forzar Permisos Totales en Linux
      run: |
        find . -type f -name "*.sh" -exec chmod +x {} + || true
        chmod -R +x tools/ || true
        chmod -R +x android/ || true

    - name: Compilar APK de Depuración (Debug)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      run: |
        cd android
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon \
          "-Pandroid.overridePathCheck=true" \
          "-Pandroid.injected.build.model.only=false"

    - name: Subir la APK resultante a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: wowee-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
