name: Compilar y Firmar APK Automáticamente

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Configurar Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Entorno y Dependencias de Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

    - name: Preparar Librerías y Archivos de Configuración
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        rm -rf include/glm && unzip -q extern/glm.zip -d include/
        rm -rf include/SDL3 android/sdl3 && mkdir -p include android/sdl3/arm64-v8a
        unzip -q extern/SDL3.zip -d android/sdl3_temp/
        mv android/sdl3_temp/SDL3 include/
        mv android/sdl3_temp/libSDL3.so android/sdl3/arm64-v8a/
        rm -rf android/sdl3_temp/
        
        sed -i 's/"main"/"wowee"/g' android/app/src/main/java/org/libsdl/app/SDLActivity.java || echo "Aviso: No se requirió parchear SDLActivity de forma externa."
        
        rm -f android/app/src/main/AndroidManifest.xml
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://android.com">
    <uses-feature android:name="android.hardware.vulkan.version" android:version="0x00401000" android:required="true" />
    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
    <uses-permission android:name="android.permission.INTERNET" />
    <application
        android:label="WoWee Warstorm"
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:theme="@style/WoweeFullscreen"
        android:allowBackup="false"
        android:hardwareAccelerated="true"
        android:hasFragileUserData="true">
        <activity
            android:name="org.libsdl.app.SDLActivity"
            android:label="WoWee Warstorm"
            android:exported="true"
            android:launchMode="singleTask"
            android:screenOrientation="sensorLandscape"
            android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density"
            android:preferMinimalPostProcessing="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF
        cp android/openssl/include/openssl/configuration.h android/openssl/include/openssl/opensslconf.h || echo "Aviso: No se encontró OpenSSL local para copiar."

    - name: Generar Keystore Digital
      env:
        STORE_PASS: ${{ secrets.STORE_PASS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
      run: |
        keytool -genkey -v \
          -keystore android/app/wowee-release.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias wowee-alias -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
          -dname "CN=Wowee, OU=Warstorm, O=WoWee-Warstorm, L=Mobiles, S=Graphics, C=US"

    - name: Asignar Permisos y Compilar APK
      env:
        STORE_PASS: ${{ secrets.STORE_PASS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
        GRADLE_OPTS: "-Xmx1548m -Dorg.gradle.workers.max=1"
        CMAKE_BUILD_PARALLEL_LEVEL: 1
      run: |
        find . -type f -name "*.sh" -exec chmod +x {} + || true
        chmod -R +x tools/ android/ || true
        cd android && rm -rf app/.cxx/ && ./gradlew clean
        ./gradlew assembleRelease --no-daemon \
          "-Pandroid.overridePathCheck=true" \
          "-Pandroid.injected.build.model.only=false" \
          "-PRELEASE_STORE_FILE=wowee-release.jks" \
          "-PRELEASE_STORE_PASSWORD=$STORE_PASS" \
          "-PRELEASE_KEY_ALIAS=wowee-alias" \
          "-PRELEASE_KEY_PASSWORD=$KEY_PASS"

    - name: Subir APK Compilada como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: wowee-release-apk
        path: android/app/build/outputs/apk/release/*.apk
