def opensslFor = { abi -> file("/home/runner/work/WoWee-Warstorm/WoWee-Warstorm/android/openssl").absolutePath }

def repoRoot = file("${rootDir}/..")

def gitVersion = {
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            workingDir repoRoot
            standardOutput = out
            errorOutput = new ByteArrayOutputStream()
        }
        return out.toString().trim().replaceFirst(/^v/, '')
    } catch (Exception ignored) {
        return '0.0.0'
    }
}()

def gitVersionCode = {
    def parts = gitVersion.tokenize('.')
    if (parts.size() < 3) return 1
    try {
        def code = parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + parts[2].toInteger()
        return Math.max(1, code)
    } catch (Exception ignored) {
        return 1
    }
}()
def stagedAssets = layout.buildDirectory.dir("staged-assets")
def stagedMusic = layout.buildDirectory.dir("staged-music")

tasks.register('stageAssets', Copy) {
    into stagedAssets
    from("${repoRoot}/assets") {
        into 'assets'
        exclude 'Original Music/**'
    }
    from("${repoRoot}/Data") {
        into 'Data'
        include 'expansions/*/dbc_layouts.json'
        include 'expansions/*/expansion.json'
        include 'expansions/*/opcodes.json'
        include 'expansions/*/update_fields.json'
        include 'opcodes/aliases.json'
        include 'opcodes/canonical.json'
    }
}

tasks.register('stageMusic', Copy) {
    into stagedMusic
    from("${repoRoot}/assets") {
        into 'assets'
        include 'Original Music/**'
    }
}

android {
    namespace 'com.wowee.client'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.wowee.client'
        minSdk 33
        targetSdk 34
        versionCode gitVersionCode
        versionName gitVersion

        externalNativeBuild {
            cmake {
                targets 'wowee'
                arguments '-DANDROID_STL=c++_shared',
                          '-DOPENSSL_ROOT_DIR=/home/runner/work/WoWee-Warstorm/WoWee-Warstorm/android/openssl',
                          '-DCMAKE_FIND_ROOT_PATH=/home/runner/work/WoWee-Warstorm/WoWee-Warstorm/android/openssl'
                cppFlags '-std=c++20'
            }
        }
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1+'
        }
    }

    sourceSets.main.assets.srcDirs = [stagedAssets]
    sourceSets.debug.assets.srcDirs = [stagedMusic]

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach { t ->
    if (t.name == 'stageAssets' || t.name == 'stageMusic') return

    final String n = t.name
    final boolean readsAssets =
        (n.startsWith('merge') && n.endsWith('Assets')) ||
        n.toLowerCase().contains('lint') ||
        n.startsWith('package') ||
        n.startsWith('bundle')
    if (!readsAssets) return

    t.dependsOn 'stageAssets'
    if (n.contains('Debug')) t.dependsOn 'stageMusic'
}

tasks.register('checkSdlJava') {
    doLast {
        def fetched = fileTree(file('.cxx')) { include '**/sdl2-src/android-project/app/src/main/java/org/libsdl/app/*.java' }
                        .files.collectEntries { [(it.name): it] }
        if (fetched.isEmpty()) {
            logger.lifecycle('checkSdlJava: SDL not fetched yet, nothing compared.')
            return
        }
        def committed = file('src/main/java/org/libsdl/app')
        def drifted = []
        fetched.each { name, src ->
            def mine = new File(committed, name)
            if (!mine.isFile() || mine.text != src.text) drifted << name
        }
        def extra = (committed.list() ?: []).findAll { it.endsWith('.java') && !fetched.containsKey(it) }
        if (drifted || extra) {
            throw new GradleException(
                "android/app/src/main/java/org/libsdl/app is out of step with the SDL " +
                "that CMakeLists.txt fetches.\n" +
                (drifted ? "  differ or missing: ${drifted.sort().join(', ')}\n" : '') +
                (extra   ? "  no longer in SDL:  ${extra.sort().join(', ')}\n" : '') +
                "Re-copy them from the fetched android-project tree under app/.cxx.")
        }
        logger.lifecycle("checkSdlJava: ${fetched.size()} files match the fetched SDL.")
    }
}
tasks.configureEach { if (name == 'compileDebugJavaWithJavac' || name == 'compileReleaseJavaWithJavac') finalizedBy 'checkSdlJava' }
